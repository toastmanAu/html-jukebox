<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101d22;color:#ede3c8;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:6%;left:7%;pointer-events:none}p{color:#a7bbad;letter-spacing:2px;font-size:10px}h1{font:normal clamp(44px,8vw,84px) Georgia,serif;margin:15px 0}label{position:absolute;bottom:7%;left:7%;display:flex;align-items:center;gap:15px;background:#14262bdd;padding:12px 18px;border:1px solid #729689;border-radius:6px}input{accent-color:#d9b77d;width:130px}button{position:absolute;bottom:7%;right:7%;min-height:48px;padding:12px 18px;color:#ede3c8;border:1px solid #729689;background:#14262b;border-radius:6px;font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #d9b77d;outline-offset:5px}@media(max-width:500px){label{bottom:14%;gap:10px}button{left:7%;right:auto}h1{font-size:48px}}</style>
<canvas aria-label="Animated elliptical orbits with eight planets"></canvas><header><p>AN INTERACTIVE CELESTIAL SKETCH</p><h1>Orbit Study.</h1><p>A SMALL UNIVERSE. AT YOUR PACE.</p></header>
<label>Orbital speed <input type="range" min="0" max="200" value="60" aria-label="Orbital speed"></label><button type="button">Pause motion</button>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=document.querySelector('input'),button=document.querySelector('button');
let width=0,height=0,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){width=innerWidth;height=innerHeight;const scale=Math.min(devicePixelRatio||1,1.5);canvas.width=width*scale;canvas.height=height*scale;ctx.setTransform(scale,0,0,scale,0,0);draw()}
function draw(){ctx.clearRect(0,0,width,height);const x=width*.56,y=height*.56,unit=Math.min(width,height)*.048;const glow=ctx.createRadialGradient(x,y,0,x,y,unit*8);glow.addColorStop(0,'#91b9a821');glow.addColorStop(1,'#91b9a800');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);ctx.save();ctx.translate(x,y);ctx.rotate(-.32);for(let i=1;i<=8;i++){const r=unit*(i+1);ctx.beginPath();ctx.ellipse(0,0,r,r*.59,0,0,Math.PI*2);ctx.strokeStyle='#71998c44';ctx.lineWidth=1;ctx.stroke();const angle=time/(i*.65+1)+i*1.7;ctx.beginPath();ctx.arc(Math.cos(angle)*r,Math.sin(angle)*r*.59,3+i*.6,0,Math.PI*2);ctx.fillStyle=i%2?'#c4d9b5':'#daba82';ctx.fill()}ctx.beginPath();ctx.arc(0,0,unit*.42,0,Math.PI*2);ctx.fillStyle='#edc88d';ctx.shadowColor='#edc88d';ctx.shadowBlur=24;ctx.fill();ctx.restore()}
function frame(now){if(!paused)time+=Math.min((now-last)/1000,.04)*Number(slider.value)/100;last=now;draw();requestAnimationFrame(frame)}
function label(){button.textContent=paused?'Resume motion':'Pause motion'}button.onclick=()=>{paused=!paused;label()};addEventListener('resize',resize);label();resize();requestAnimationFrame(frame);
</script></html>
